{%  extends 'playground/base.html' %}

{% block content %}
  {% if form.errors %}
  <p>your user name & password did not match try again</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button name="submit">Log in</button>
    <input type="hidden" name="next" value="{% url 'playground:home' %}">
  </form>
{% endblock content %}
